<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineWave | Movie Tickets</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0c0c12;
    --card: #171720;
    --accent: #ff3d5a;
    --text: #ffffff;
    --muted: #a5a5b5;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* NAVIGATION */

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;
    background: #111119;
    border-bottom: 1px solid #252530;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: -1px;
}

.logo span {
    color: white;
}

.nav-links {
    display: flex;
    gap: 28px;
}

.nav-links a {
    text-decoration: none;
    color: #c5c5d1;
    font-size: 14px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: var(--accent);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

select, input, button {
    font-family: inherit;
}

.city-select {
    background: #22222e;
    color: white;
    padding: 10px;
    border: 1px solid #363644;
    border-radius: 8px;
}

.login-btn, .primary-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.login-btn:hover, .primary-btn:hover {
    background: #e82b49;
    transform: translateY(-2px);
}

/* HERO SECTION */

.hero {
    margin: 30px auto;
    width: 86%;
    min-height: 340px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    background:
        linear-gradient(90deg, rgba(9,9,16,0.98) 5%,
        rgba(9,9,16,0.78) 48%, rgba(9,9,16,0.15)),
        url("https://image.tmdb.org/t/p/w1280/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg")
        center 35% / cover;
}

.hero-content {
    padding: 45px;
    max-width: 560px;
}

.tag {
    display: inline-block;
    background: rgba(255,61,90,0.17);
    color: #ff7c91;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 12px;
    margin-bottom: 18px;
    letter-spacing: 1px;
}

.hero h1 {
    font-size: clamp(34px, 4vw, 52px);
    margin-bottom: 15px;
    line-height: 1.1;
}

.hero p {
    color: #d0d0db;
    line-height: 1.7;
    margin-bottom: 24px;
    font-size: 14px;
}

.hero-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.secondary-btn {
    padding: 11px 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid #777;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* SEARCH */

.search-section {
    width: 86%;
    margin: 40px auto 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.search-section h2 {
    font-size: 25px;
}

.search-box {
    background: #191923;
    border: 1px solid #30303d;
    padding: 12px 16px;
    border-radius: 10px;
    width: 280px;
    color: white;
    outline: none;
}

.search-box:focus {
    border-color: var(--accent);
}

/* FILTERS */

.filters {
    width: 86%;
    margin: 0 auto 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 9px 18px;
    border-radius: 20px;
    border: 1px solid #343440;
    background: transparent;
    color: #c6c6d0;
    cursor: pointer;
}

.filter-btn.active,
.filter-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

/* MOVIE GRID */

.movie-grid {
    width: 86%;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 25px;
}

.movie-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #262632;
    transition: transform 0.3s, border-color 0.3s;
}

.movie-card:hover {
    transform: translateY(-6px);
    border-color: #4c3540;
}

.poster-wrap {
    height: 310px;
    position: relative;
    overflow: hidden;
    background: #252530;
}

.poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
}

.movie-card:hover .poster {
    transform: scale(1.05);
}

.rating {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: rgba(0,0,0,0.82);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 12px;
}

.movie-info {
    padding: 17px;
}

.movie-info h3 {
    font-size: 17px;
    margin-bottom: 9px;
}

.movie-meta {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
}

.movie-bottom {
    margin-top: 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.movie-bottom .primary-btn {
    padding: 9px 13px;
    font-size: 12px;
}

.language {
    font-size: 11px;
    color: #ff8294;
    background: rgba(255,61,90,0.1);
    padding: 6px 8px;
    border-radius: 5px;
}

/* OFFER BANNER */

.offer {
    width: 86%;
    margin: 55px auto;
    background: linear-gradient(110deg, #47162a, #21152d, #161622);
    border: 1px solid #492536;
    border-radius: 16px;
    padding: 30px 35px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.offer h2 {
    font-size: 23px;
    margin-bottom: 10px;
}

.offer p {
    color: #c2b7c5;
    font-size: 14px;
    line-height: 1.6;
}

/* FOOTER */

footer {
    margin-top: 60px;
    padding: 35px 7%;
    background: #111119;
    border-top: 1px solid #282833;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 2;
}

footer strong {
    color: var(--accent);
}

/* BOOKING MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    width: 100%;
    max-width: 460px;
    background: #191923;
    border: 1px solid #363644;
    border-radius: 18px;
    padding: 28px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}

.close-btn {
    position: absolute;
    top: 15px;
    right: 18px;
    border: none;
    background: none;
    color: white;
    font-size: 27px;
    cursor: pointer;
}

.modal-content h2 {
    margin-bottom: 8px;
    padding-right: 25px;
}

.modal-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 25px;
}

.modal-content h4 {
    margin-bottom: 12px;
    margin-top: 20px;
}

.showtimes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.time-btn {
    background: #22222e;
    color: white;
    border: 1px solid #41414e;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.time-btn.selected {
    background: rgba(255,61,90,0.18);
    border-color: var(--accent);
    color: #ff8b9d;
}

.seat-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 12px 0;
}

.seat {
    width: 29px;
    height: 27px;
    border: 1px solid #5b5b6b;
    background: #292936;
    border-radius: 6px 6px 3px 3px;
    cursor: pointer;
    color: white;
    font-size: 10px;
}

.seat.selected {
    background: #28b67a;
    border-color: #28b67a;
}

.seat.occupied {
    background: #555561;
    border-color: #555561;
    cursor: not-allowed;
    opacity: 0.5;
}

.screen {
    text-align: center;
    padding: 12px;
    margin: 25px 10px;
    color: #b9b9c8;
    font-size: 11px;
    letter-spacing: 4px;
    border-top: 3px solid #8d8dff;
    border-radius: 50% 50% 0 0;
}

.booking-summary {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 0;
    margin-top: 15px;
    border-top: 1px solid #363644;
    color: #d4d4df;
    font-size: 14px;
}
